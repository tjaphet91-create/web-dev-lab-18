<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Basic contact form</h2>
    <form>
        <label>Name</label><br>
        <input type="text" placeholder="Enter name"><br>
        <input type="email" placeholder="Enter email"><br>
        <label>Message</label><br>
        <textarea></textarea><br>
    </form>
    <input type="button" value="SUBMIT">

    <h3>REGISTRATION FORM</h3>
    <table>
        <tr>
            <td>FullName</td>
            <td><input type="text" required></td>
        </tr>
        <tr>
            <td>Email</td>
            <td><input type="email" required></td>
        </tr>
        <tr>
            <td>Password</td>
            <td><input type="password" required></td>
        </tr>
        <tr>
            <td>Gender</td>
            <td><input type="radio" name="gender" value="male" required>Male</td>
            <td><input type="radio" name="gender" value="female" required>Female</td>
        </tr>
        <tr>
            <td>COURSES</td>
            <td><input type="checkbox" name="COURSES" value="html"required>Html</td>
            <td><input type="checkbox" name="COURSES" value="CSS"required>CSS</td>
            <td><input type="checkbox" name="COURSES" value="javascript"required>JavaScript</td>
            
        </tr>
    </table>
<input type="button" value="SUBMIT">
</body>
</html>
